version: '3.8'

services:
  # ---- FastAPI Backend ----
  backend:
    build: ./backend
    container_name: alzheimer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - face_data:/app/data
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=alzheimer_helper
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_started
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - alzheimer-net

  # ---- MongoDB Database ----
  mongodb:
    image: mongo:7
    container_name: alzheimer-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - alzheimer-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Ollama LLM Server ----
  ollama:
    image: ollama/ollama
    container_name: alzheimer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - alzheimer-net

volumes:
  mongo_data:
    driver: local
  face_data:
    driver: local
  ollama_data:
    driver: local

networks:
  alzheimer-net:
    driver: bridge
